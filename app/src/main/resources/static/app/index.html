<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JCondo</title>
    <meta name="description" content="App do morador: avisos, reservas das áreas comuns e ocorrências do condomínio.">

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1b2d" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

    <!-- iPhone: instala pela opcao "Adicionar a Tela de Inicio" -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JCondo">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- icones usados pelo app (svg inline pra funcionar offline) -->

        <symbol id="i-ocorrencias" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
        <symbol id="i-perfil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-voltar" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>

<div id="app" class="app">
    <!-- tela de carregamento (some quando o JavaScript monta o app) -->
    <div class="carregando-inicial">
        <img src="icons/icon-192.png" alt="" width="72" height="72">
        <p>JCondo</p>
    </div>
</div>

<noscript>
    <p style="padding:24px;font-family:sans-serif">O JCondo precisa do JavaScript ativado.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
