<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Moradores')}"></head>
<body class="jc-body">
<div class="jc-app">
    <aside th:replace="~{layout :: sidebar('moradores')}"></aside>

    <div class="jc-conteudo">
        <header th:replace="~{layout :: topo('Moradores')}"></header>

        <main class="jc-main">
            <div th:replace="~{layout :: alertas}"></div>

            <div class="jc-pagina-topo">
                <div>
                    <h1>Moradores</h1>
                    <p>Cadastro dos moradores e do acesso de cada um ao app.</p>
                </div>
                <a th:href="@{/moradores/novo}" class="btn btn-primary d-none d-sm-inline-flex align-items-center gap-2">
                    <i class="bi bi-person-plus"></i>Novo morador
                </a>
            </div>

            <!-- quando nao tem nenhum morador cadastrado -->
            <div th:if="${#lists.isEmpty(moradores)}" class="jc-card jc-vazio">
                <i class="bi bi-inbox"></i>
                <p>Nenhum morador cadastrado ainda.</p>
                <a th:href="@{/moradores/novo}" class="btn btn-outline-primary">
                    <i class="bi bi-person-plus me-1"></i>Cadastrar o primeiro morador
                </a>
            </div>

            <th:block th:unless="${#lists.isEmpty(moradores)}">
                <div class="jc-filtros">
                    <label class="jc-busca mb-0">
                        <span class="visually-hidden">Buscar morador</span>
                        <i class="bi bi-search"></i>
                        <input type="search" class="form-control" placeholder="Buscar por nome, apartamento, bloco ou e-mail"
                               data-filtro="#tabelaMoradores" data-contador="#totalMoradores">
                    </label>
                </div>

                <div class="jc-card jc-card-tabela">
                    <div class="table-responsive">
                        <table class="table jc-tabela" id="tabelaMoradores">
                            <thead>
                                <tr>
                                    <th scope="col">Nome</th>
                                    <th scope="col">Apto</th>
                                    <th scope="col">Bloco</th>
                                    <th scope="col">CPF</th>
                                    <th scope="col">Telefone</th>
                                    <th scope="col">E-mail</th>
                                    <th scope="col" class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="m : ${moradores}"
                                    th:attr="data-busca=${m.nome + ' ' + m.apartamento + ' ' + m.bloco + ' ' + m.email}">
                                    <td class="jc-td-titulo fw-semibold" data-label="Nome" th:text="${m.nome}">Nome</td>
                                    <td data-label="Apartamento"><span class="jc-tag" th:text="${m.apartamento}">101</span></td>
                                    <td data-label="Bloco"><span class="jc-tag" th:text="${m.bloco}">A</span></td>
                                    <td data-label="CPF" class="text-nowrap" th:text="${m.cpf}">000.000.000-00</td>
                                    <td data-label="Telefone" class="text-nowrap">
                                        <a class="text-decoration-none" th:href="'tel:' + ${#strings.replace(#strings.replace(#strings.replace(#strings.replace(m.telefone,' ',''),'(',''),')',''),'-','')}"
                                           th:text="${m.telefone}">(00) 00000-0000</a>
                                    </td>
                                    <td data-label="E-mail" th:text="${m.email}">email@exemplo.com</td>
                                    <td class="jc-td-acoes">
                                        <div class="jc-acoes">
                                            <a th:href="@{/moradores/editar/{id}(id=${m.id})}"
                                               class="btn btn-sm btn-outline-primary" title="Editar">
                                                <i class="bi bi-pencil-square"></i><span class="d-md-none ms-1">Editar</span>
                                            </a>
                                            <form th:action="@{/moradores/excluir/{id}(id=${m.id})}" method="post"
                                                  th:attr="data-confirmar='Excluir ' + ${m.nome} + '? As reservas e ocorrências dele também serão removidas.'">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir">
                                                    <i class="bi bi-trash"></i><span class="d-md-none ms-1">Excluir</span>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="jc-card-rodape">
                        <i class="bi bi-sort-alpha-down me-1"></i>
                        <span id="totalMoradores" th:text="${#lists.size(moradores)}">0</span> morador(es), ordenados por nome.
                    </div>
                </div>
            </th:block>
        </main>

        <footer th:replace="~{layout :: rodape}"></footer>
    </div>
</div>

<a th:href="@{/moradores/novo}" class="jc-fab d-sm-none" aria-label="Novo morador"><i class="bi bi-plus-lg"></i></a>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
