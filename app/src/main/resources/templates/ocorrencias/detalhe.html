<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ocorrência')}"></head>
<body class="jc-body">
<div class="jc-app">
    <aside th:replace="~{layout :: sidebar('ocorrencias')}"></aside>

    <div class="jc-conteudo">
        <header th:replace="~{layout :: topo('Ocorrência')}"></header>

        <main class="jc-main">
            <a th:href="@{/ocorrencias}" class="d-inline-flex align-items-center gap-1 text-decoration-none mb-3">
                <i class="bi bi-arrow-left"></i>Voltar para ocorrências
            </a>

            <div th:replace="~{layout :: alertas}"></div>

            <div class="row g-3">
                <!-- dados da ocorrencia -->
                <div class="col-12 col-lg-7">
                    <article class="jc-card h-100">
                        <div class="jc-card-corpo">
                            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                <span class="jc-status" th:classappend="'jc-status-' + ${ocorrencia.status}" th:text="${ocorrencia.status.descricao}">Aberta</span>
                                <span class="jc-tag" th:text="${ocorrencia.categoria.descricao}">Manutenção</span>
                                <span class="small text-muted ms-auto" th:text="'#' + ${ocorrencia.id}"></span>
                            </div>
                            <h1 class="h4 fw-bold" th:text="${ocorrencia.titulo}">Título</h1>
                            <p class="mt-3" style="white-space: pre-line" th:text="${ocorrencia.descricao}">Descrição</p>

                            <dl class="row small mb-0 mt-4 pt-3 border-top">
                                <dt class="col-5 col-sm-4 text-muted fw-normal">Morador</dt>
                                <dd class="col-7 col-sm-8 fw-semibold" th:text="${ocorrencia.morador.nome}">Ana</dd>
                                <dt class="col-5 col-sm-4 text-muted fw-normal">Unidade</dt>
                                <dd class="col-7 col-sm-8" th:text="'Apto ' + ${ocorrencia.morador.apartamento} + ', bloco ' + ${ocorrencia.morador.bloco}"></dd>
                                <dt class="col-5 col-sm-4 text-muted fw-normal">Telefone</dt>
                                <dd class="col-7 col-sm-8" th:text="${ocorrencia.morador.telefone}"></dd>
                                <dt class="col-5 col-sm-4 text-muted fw-normal">Aberta em</dt>
                                <dd class="col-7 col-sm-8" th:text="${#temporals.format(ocorrencia.abertaEm, 'dd/MM/yyyy HH:mm')}"></dd>
                                <dt class="col-5 col-sm-4 text-muted fw-normal">Última atualização</dt>
                                <dd class="col-7 col-sm-8 mb-0" th:text="${#temporals.format(ocorrencia.atualizadaEm, 'dd/MM/yyyy HH:mm')}"></dd>
                            </dl>
                        </div>
                    </article>
                </div>

                <!-- atendimento -->
                <div class="col-12 col-lg-5">
                    <section class="jc-card">
                        <div class="jc-card-topo">
                            <h2><i class="bi bi-chat-left-text me-2 text-primary"></i>Atendimento</h2>
                        </div>
                        <div class="jc-card-corpo">
                            <div th:if="${ocorrencia.resposta}" class="alert alert-light border small">
                                <div class="fw-semibold mb-1">Última resposta enviada</div>
                                <span th:text="${ocorrencia.resposta}"></span>
                            </div>
                            <form th:action="@{/ocorrencias/{id}/atualizar(id=${ocorrencia.id})}" method="post">
                                <div class="mb-3">
                                    <span class="form-label d-block">Status</span>
                                    <div class="d-flex flex-wrap gap-2">
                                        <th:block th:each="s : ${statusLista}">
                                            <input type="radio" class="btn-check" name="status" th:id="'st-' + ${s}" th:value="${s}"
                                                   th:checked="${ocorrencia.status == s}" autocomplete="off">
                                            <label class="btn btn-outline-primary btn-sm" th:for="'st-' + ${s}" th:text="${s.descricao}">Aberta</label>
                                        </th:block>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="resposta" class="form-label">Resposta ao morador</label>
                                    <textarea id="resposta" name="resposta" class="form-control" rows="4" maxlength="1000"
                                              placeholder="Ex.: Técnico agendado para amanhã de manhã."></textarea>
                                    <div class="form-text">O morador vê a resposta no app.</div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send me-1"></i>Salvar atendimento</button>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout :: rodape}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
