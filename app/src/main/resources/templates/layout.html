<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a5f">
    <title th:text="${titulo} + ' - JCondo'">JCondo</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- menu lateral: gaveta (offcanvas) no celular e fixo a partir de 992px -->
<aside th:fragment="sidebar(ativo)" class="jc-sidebar offcanvas-lg offcanvas-start" tabindex="-1"
       id="menuLateral" aria-labelledby="menuLateralTitulo">
    <div class="offcanvas-header">
        <a class="jc-brand" th:href="@{/painel}" id="menuLateralTitulo">
            <span class="jc-brand-icon"><i class="bi bi-buildings"></i></span>JCondo
        </a>
        <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                data-bs-target="#menuLateral" aria-label="Fechar menu"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column px-3 px-lg-0">
        <nav class="jc-nav" aria-label="Menu principal">
            <a th:href="@{/painel}" th:classappend="${ativo == 'painel'} ? 'ativo'">
                <i class="bi bi-grid-1x2"></i>Painel
            </a>
            <a th:href="@{/moradores}" th:classappend="${ativo == 'moradores'} ? 'ativo'">
                <i class="bi bi-people"></i>Moradores
            </a>
            <a th:href="@{/avisos}" th:classappend="${ativo == 'avisos'} ? 'ativo'">
                <i class="bi bi-megaphone"></i>Avisos
            </a>
            <a th:href="@{/reservas}" th:classappend="${ativo == 'reservas'} ? 'ativo'">
                <i class="bi bi-calendar2-check"></i>Reservas
            </a>
            <a th:href="@{/ocorrencias}" th:classappend="${ativo == 'ocorrencias'} ? 'ativo'">
                <i class="bi bi-exclamation-octagon"></i>Ocorrências
            </a>
            <a th:href="@{/areas}" th:classappend="${ativo == 'areas'} ? 'ativo'">
                <i class="bi bi-house-gear"></i>Áreas comuns
            </a>

        </nav>

        <div class="jc-usuario mt-auto mb-3 mb-lg-0">
            <div class="jc-avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">S</div>
            <div class="small flex-grow-1 min-w-0">
                <div class="fw-semibold">Síndico</div>
                <div class="text-white-50 text-truncate" sec:authentication="name">sindico@jcondo.com</div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm jc-btn-sair" title="Sair" aria-label="Sair">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- barra do topo: no celular tem o botao que abre o menu -->
<header th:fragment="topo(titulo)" class="jc-topo d-lg-none">
    <button class="btn jc-btn-menu d-lg-none" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
    </button>
    <a class="jc-topo-marca d-lg-none" th:href="@{/painel}">JCondo</a>
    <span class="text-muted d-lg-none">/</span>
    <span class="jc-topo-titulo" th:text="${titulo}">Título</span>
</header>

<!-- mensagens que vem por flash attribute depois de salvar/excluir -->
<th:block th:fragment="alertas">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-check-circle-fill"></i><span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</th:block>


<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/painel.js}"></script>
</th:block>

</body>
</html>
