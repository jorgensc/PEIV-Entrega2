<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Entrar')}"></head>
<body class="jc-body">

<main class="jc-login">
    <div class="jc-login-caixa">
        <div class="jc-login-logo"><i class="bi bi-buildings"></i></div>
        <h1 class="h3 fw-bold mb-4">JCondo</h1>

        <div th:if="${param.erro}" class="alert alert-danger" role="alert">E-mail ou senha inválidos.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Entrar</button>
        </form>
    </div>
</main>

</body>
</html>
