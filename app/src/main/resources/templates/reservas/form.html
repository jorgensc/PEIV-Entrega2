<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Nova reserva')}"></head>
<body class="jc-body">
<div class="jc-app">
    <aside th:replace="~{layout :: sidebar('reservas')}"></aside>

    <div class="jc-conteudo">
        <header th:replace="~{layout :: topo('Nova reserva')}"></header>

        <main class="jc-main">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-xl-7">

                    <a th:href="@{/reservas}" class="d-inline-flex align-items-center gap-1 text-decoration-none mb-3">
                        <i class="bi bi-arrow-left"></i>Voltar para reservas
                    </a>

                    <div th:replace="~{layout :: alertas}"></div>

                    <div class="jc-card">
                        <div class="jc-card-topo">
                            <h2 class="h5"><i class="bi bi-calendar2-plus me-2 text-primary"></i>Reservar para um morador</h2>
                        </div>
                        <div class="jc-card-corpo">
                            <p class="text-muted small">Use quando o pedido chegar pela portaria. Os moradores também reservam sozinhos pelo app.</p>
                            <form th:action="@{/reservas/salvar}" method="post">
                                <div class="mb-3">
                                    <label for="areaId" class="form-label">Área comum</label>
                                    <select id="areaId" name="areaId" class="form-select" required>
                                        <option th:each="a : ${areas}" th:value="${a.id}"
                                                th:selected="${form.areaId == a.id}"
                                                th:text="${a.nome} + ' (' + ${#temporals.format(a.horaAbertura, 'HH:mm')} + ' às ' + ${#temporals.format(a.horaFechamento, 'HH:mm')} + ')'">Salão</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="moradorId" class="form-label">Morador</label>
                                    <select id="moradorId" name="moradorId" class="form-select" required>
                                        <option th:each="m : ${moradores}" th:value="${m.id}"
                                                th:selected="${form.moradorId == m.id}"
                                                th:text="${m.nome} + ' (' + ${m.apartamento} + ' ' + ${m.bloco} + ')'">Ana</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col-12 col-sm-6 mb-3">
                                        <label for="data" class="form-label">Data</label>
                                        <input type="date" id="data" name="data" class="form-control" required
                                               th:value="${form.data}" th:min="${hoje}">
                                    </div>
                                    <div class="col-6 col-sm-3 mb-3">
                                        <label for="horaInicio" class="form-label">Início</label>
                                        <input type="time" id="horaInicio" name="horaInicio" class="form-control" required
                                               th:value="${form.horaInicio == null} ? '' : ${#temporals.format(form.horaInicio, 'HH:mm')}">
                                    </div>
                                    <div class="col-6 col-sm-3 mb-3">
                                        <label for="horaFim" class="form-label">Fim</label>
                                        <input type="time" id="horaFim" name="horaFim" class="form-control" required
                                               th:value="${form.horaFim == null} ? '' : ${#temporals.format(form.horaFim, 'HH:mm')}">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="observacao" class="form-label">Observação</label>
                                    <input type="text" id="observacao" name="observacao" class="form-control" maxlength="255"
                                           th:value="${form.observacao}" placeholder="Opcional">
                                </div>
                                <div class="jc-form-acoes">
                                    <a th:href="@{/reservas}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Confirmar reserva</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout :: rodape}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
