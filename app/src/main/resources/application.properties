spring.application.name=jcondo

# conexao com o banco
# local (XAMPP) usa os valores padrao depois do ":"
# no Azure os valores vem das variaveis de ambiente configuradas no App Service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jcondo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# pool pequeno: o MySQL B1ms do Azure aceita poucas conexoes
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# atras do proxy do App Service (HTTPS termina no Azure)
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/manifest+json,image/svg+xml

# erros da API no formato Problem Details (RFC 9457)
spring.mvc.problemdetails.enabled=true
spring.jackson.time-zone=America/Sao_Paulo
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm
spring.mvc.format.date-time=iso

# JWT do app (no Azure vem da variavel JWT_SECRET)
jcondo.jwt.secret=${JWT_SECRET:jcondo-segredo-local-apenas-para-desenvolvimento}
jcondo.jwt.validade-horas=${JWT_VALIDADE_HORAS:12}
jcondo.cors.origens=${CORS_ORIGENS:*}
jcondo.fuso=America/Sao_Paulo

# dados de demonstracao (sindico, moradores, areas...) quando o banco esta vazio
jcondo.seed-demo=${SEED_DEMO:true}

# health check do App Service: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.nome=JCondo
info.app.versao=@project.version@

# swagger so mostra a API
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
