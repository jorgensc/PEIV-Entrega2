# testes rodam com H2 em memoria, nao precisam de MySQL (funciona no GitHub Actions)
spring.datasource.url=jdbc:h2:mem:jcondo-teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm
spring.mvc.format.date-time=iso
jcondo.jwt.secret=segredo-dos-testes
jcondo.fuso=America/Sao_Paulo
jcondo.seed-demo=true
springdoc.paths-to-match=/api/**
management.endpoints.web.exposure.include=health,info
