# pipeline do JCondo
# - todo push e pull request: compila e roda os testes (CI)
# - push na main: publica o .jar no Azure App Service (CD)
#
# pra ativar o deploy precisa cadastrar no GitHub (Settings > Secrets and variables > Actions):
#   variable AZURE_WEBAPP_NAME             -> nome do App Service criado no Azure
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  -> conteudo do "perfil de publicacao" baixado no portal
# enquanto a variable nao existir o job de deploy fica pulado e so o CI roda

name: CI/CD JCondo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar testes unitarios
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Guardar o .jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: jcondo-jar
          path: app/target/jcondo-*.jar
          retention-days: 7

  deploy:
    name: Deploy no Azure App Service
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    environment:
      name: producao
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Baixar o .jar do job de build
        uses: actions/download-artifact@v4
        with:
          name: jcondo-jar

      - name: Publicar no Azure
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '*.jar'
