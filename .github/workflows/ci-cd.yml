# pipeline do JCondo
# - todo push e pull request: compila e roda os testes unitarios e de integracao da API (CI)
# - push na main: publica o jcondo.jar testado como Release do GitHub (CD)
#   o servidor self-hosted baixa essa versao com: infra\atualizar.cmd

name: CI/CD JCondo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes (unitarios + API com H2)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar o resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/target/surefire-reports/
          retention-days: 7

      - name: Guardar o .jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: jcondo-jar
          path: app/target/jcondo.jar
          retention-days: 7

  release:
    name: Publicar versao (GitHub Release)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Baixar o .jar do job de build
        uses: actions/download-artifact@v4
        with:
          name: jcondo-jar

      - name: Criar a release com o jcondo.jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: JCondo 2.0.${{ github.run_number }}
          make_latest: true
          files: jcondo.jar
          body: |
            Versão gerada automaticamente pelo pipeline depois de passar nos testes.
            Commit: ${{ github.sha }}

            Para publicar no servidor: `infra\atualizar.cmd`
