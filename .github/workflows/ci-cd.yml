# pipeline do JCondo
# - todo push e pull request: compila e roda os testes unitarios e de integracao da API (CI)
# - push na main: publica o .jar no Azure App Service e confere o health check (CD)
#
# pra ativar o deploy precisa cadastrar no GitHub (Settings > Secrets and variables > Actions):
#   variable AZURE_WEBAPP_NAME             -> nome do App Service criado pelo infra/deploy.ps1
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  -> conteudo do perfil de publicacao (infra/.perfil-publicacao.local.xml)
# enquanto a variable nao existir o job de deploy fica pulado e so o CI roda

name: CI/CD JCondo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes (unitarios + API com H2)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar o resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/target/surefire-reports/
          retention-days: 7

      - name: Guardar o .jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: jcondo-jar
          path: app/target/jcondo.jar
          retention-days: 7

  deploy:
    name: Deploy no Azure App Service
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    environment:
      name: producao
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Baixar o .jar do job de build
        uses: actions/download-artifact@v4
        with:
          name: jcondo-jar

      - name: Publicar no Azure
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: jcondo.jar

      # smoke test: so considera o deploy ok quando a aplicacao responde UP
      - name: Conferir o health check
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}"
          for i in $(seq 1 30); do
            status=$(curl -s "$url/actuator/health" | grep -o '"status":"[A-Z]*"' | head -1)
            echo "tentativa $i: $status"
            if [ "$status" = '"status":"UP"' ]; then exit 0; fi
            sleep 10
          done
          echo "a aplicacao nao respondeu UP"
          exit 1
